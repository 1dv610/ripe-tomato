# Runs the same checks as a developer would locally, so a change that breaks the
# architecture rules in eslint.config.js, the formatting, a test or the build is
# stopped before it can be merged. Make the "check" and "e2e" jobs required status
# checks in the branch protection for main to enforce it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Includes the architecture rules: the MVC dependency direction is enforced here.
      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:run

      - run: npm run build

  # A separate job: it needs a browser, takes longer and runs in real time, so a slow runner
  # can make it flaky. Keeping it apart shows at a glance whether a failure is in the fast
  # checks or in the browser.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # The report shows every step of a failed test, with a trace of the retry.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
